<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#glowGrad)" stroke-width="6" stroke-opacity="0.35" />

  <!-- Background subtle grid glow circle -->
  <circle cx="256" cy="256" r="160" fill="#14b8a6" fill-opacity="0.12" filter="url(#glow)" />

  <!-- Shield Shape (Capital Control / Masraf Güvenliği) -->
  <path d="M256 96 C332 96 388 126 388 126 C388 280 298 376 256 408 C214 376 124 280 124 126 C124 126 180 96 256 96 Z"
        fill="url(#shieldGrad)" fill-opacity="0.18" stroke="url(#shieldGrad)" stroke-width="12" stroke-linejoin="round" />

  <!-- Central Currency Symbol ₺ (Turkish Lira Styled) -->
  <!-- Main Vertical Stem with Double Crossbars and Curve -->
  <g fill="none" stroke="#f8fafc" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- Vertical stem -->
    <path d="M236 170 L236 348 C236 376 264 382 292 372" stroke="#2dd4bf" stroke-width="26" />
    <!-- Lower Bar -->
    <path d="M196 268 L286 216" stroke="#f8fafc" stroke-width="24" />
    <!-- Upper Bar -->
    <path d="M196 226 L286 174" stroke="#f8fafc" stroke-width="24" />
    <!-- Upper Hook Arc -->
    <path d="M236 170 C242 162 258 152 284 154 C314 156 328 174 328 198 C328 226 298 252 236 276" stroke="#2dd4bf" stroke-width="26" />
  </g>

  <!-- Sparkles / Gems -->
  <circle cx="376" cy="136" r="14" fill="#38bdf8" />
  <circle cx="136" cy="136" r="10" fill="#2dd4bf" />
  <circle cx="256" cy="442" r="8" fill="#34d399" />
</svg>
